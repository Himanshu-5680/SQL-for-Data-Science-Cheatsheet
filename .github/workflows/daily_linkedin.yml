name: Daily LinkedIn SQL Post

on:
  schedule:
    - cron: '00 03 * * *' # 3:00 AM UTC = 8:30 AM IST daily
  workflow_dispatch: # Manual test button in GitHub Actions

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - run: pip install requests
      
      - name: Publish Next Post from Queue
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python auto_post.py
        
      - name: Commit Updated Queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts_queue.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: mark LinkedIn post as published" && git push)